<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>Карта BLE-меток — WORK WATCH</title>
  <meta name="theme-color" content="#2196F3" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Ускоряем загрузку фото меток: DNS + TLS handshake к Yandex Storage делаются заранее -->
  <link rel="preconnect" href="https://storage.yandexcloud.net" crossorigin />
  <link rel="dns-prefetch" href="https://storage.yandexcloud.net" />
  <link rel="preconnect" href="https://owcuvcshwtivqueftiuk.supabase.co" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  <link rel="stylesheet" href="ble-map.css?v=20260523i" />
</head>
<body>
  <div class="ble-map-access-gate" id="bleMapAccessGate" aria-hidden="true">
    <form class="ble-map-access-panel" id="bleMapAccessForm" role="dialog" aria-labelledby="bleMapAccessTitle">
      <h2 class="ble-map-access-title" id="bleMapAccessTitle">Карта BLE-меток</h2>
      <p class="ble-map-access-hint">Введите пароль доступа к карте.</p>
      <label class="ble-map-access-label" for="bleMapAccessInput">
        <span class="visually-hidden">Пароль</span>
        <input
          type="password"
          id="bleMapAccessInput"
          class="ble-map-access-input"
          name="password"
          autocomplete="current-password"
          placeholder="Пароль"
          required
        />
      </label>
      <p class="ble-map-access-err" id="bleMapAccessErr" role="alert"></p>
      <button type="submit" class="ble-map-access-submit" id="bleMapAccessSubmit">Войти</button>
    </form>
  </div>
  <header class="ble-map-page-header" id="bleMapPageHeader">
    <a class="ble-map-page-back" href="index.html" id="bleMapBackLink">← График</a>
    <h1 class="ble-map-page-title">Карта BLE-меток</h1>
  </header>

  <div class="ble-map-page-main">
    <section class="map-section open" data-map-section="ble" aria-label="Карта BLE-меток">
      <div class="map-inner">
        <div id="mapMsg" class="map-msg" hidden></div>
        <div id="bleMap">
          <div class="map-placeholder" id="mapPlaceholder">Загрузка карты…</div>
        </div>
        <div class="map-float-dock" id="mapFloatDock" hidden>
          <div class="map-toolbar" id="mapToolbar">
            <div class="map-toolbar-row map-toolbar-row--fields">
            <button
              type="button"
              class="map-ww-logo-btn"
              id="bleMapBackLogo"
              title="График работ"
              aria-label="Вернуться к графику"
            >
              <img src="assets/workwatch-mark.png" width="32" height="22" alt="" decoding="async" />
            </button>
            <div id="mapSearchBlock" class="map-search-bar map-search-bar--toolbar">
              <input type="text" id="mapBleSearch" placeholder="№ метки" inputmode="numeric" autocomplete="off" enterkeyhint="search" aria-label="№ метки" />
              <button type="button" class="map-search-clear" id="mapSearchClear" title="Очистить" aria-label="Очистить">✕</button>
            </div>
            <label class="map-route-field map-route-field--toolbar" id="mapRouteFieldDock" hidden>
              <span class="map-route-field__label">Маршрут</span>
              <select class="map-route-select" id="mapRouteSelectDock" data-ble-route-select aria-label="Маршрут">
                <option value="">Все</option>
              </select>
            </label>
            <label class="map-route-field map-route-field--toolbar map-toolbar-field--layer-actions" id="mapLayerFieldActions">
              <span class="map-route-field__label">Карта</span>
              <select id="mapBaseLayerSelectActions" aria-label="Подложка карты">
                <option value="street">Схема</option>
                <option value="satellite">Спутник</option>
                <option value="hybrid">Гибрид</option>
                <option value="genplan" id="mapBaseLayerGenplanOptActions" hidden>Генплан</option>
              </select>
            </label>
            </div>
            <div class="map-toolbar-row map-toolbar-row--actions">
            <button type="button" class="map-filter-btn filter-all active" data-filter="all">
              Все <span class="filter-count" id="fcAll">0</span>
            </button>
            <button type="button" class="map-filter-btn filter-inspection" data-filter="inspection">
              <span class="map-filter-label map-filter-label--long">Не пройденные</span>
              <span class="map-filter-label map-filter-label--short">Не пройд.</span>
              <span class="filter-count" id="fcInsp">0</span>
            </button>
            <button
              type="button"
              class="map-retry-btn"
              id="mapRetryBtn"
              title="Обновить метки и фото с сервера (API через Supabase; без VPN — кэш и прокси фото)"
              aria-label="Обновить данные карты"
            >
              <span class="map-toolbar-text map-toolbar-text--long">Обновить</span>
              <span class="map-toolbar-text map-toolbar-text--short">↺</span>
            </button>
            <span class="map-toolbar__sep map-toolbar__sep--before-edit" aria-hidden="true"></span>
            <button type="button" class="map-edit-mode-btn" id="mapEditModeBtn" title="Редактировать метки и зоны">
              <span class="map-toolbar-text map-toolbar-text--long">Редактировать</span>
              <span class="map-toolbar-text map-toolbar-text--short">Правка</span>
            </button>
            <input
              type="file"
              id="mapFieldPackFile"
              accept=".zip,application/zip"
              hidden
              aria-hidden="true"
            />
            <button
              type="button"
              class="map-field-pack-btn"
              id="mapFieldPackBtn"
              title="Офлайн-режим: координаты и фото меток в память телефона (без zip)"
            >
              <span class="map-toolbar-text map-toolbar-text--long">Офлайн</span>
              <span class="map-toolbar-text map-toolbar-text--short">Офлайн</span>
            </button>
            </div>
            <div class="map-toolbar-row map-toolbar-row--edit" id="mapEditToolsRow" hidden>
              <div id="mapEditTools" class="map-edit-tools map-edit-tools--dock">
                <label class="map-route-field map-route-field--toolbar map-toolbar-field--layer" id="mapLayerFieldDock">
                  <span class="map-route-field__label">Карта</span>
                  <select id="mapBaseLayerSelect" aria-label="Подложка карты">
                    <option value="street">Схема</option>
                    <option value="satellite">Спутник</option>
                    <option value="hybrid">Гибрид</option>
                    <option value="genplan" id="mapBaseLayerGenplanOpt" hidden>Генплан</option>
                  </select>
                </label>
                <label class="map-route-field map-route-field--toolbar map-toolbar-field--tools" id="mapToolsFieldDock">
                  <span class="map-route-field__label">Инструменты</span>
                  <select id="mapEditToolsSelect" aria-label="Инструменты">
                    <option value="">—</option>
                    <option value="ruler">Линейка</option>
                    <option value="line">Линия</option>
                    <option value="parallel">Параллельные</option>
                    <option value="genplan-calib" id="mapEditToolsGenplanOpt" hidden>Подогнать генплан</option>
                  </select>
                </label>
                <div class="map-draw-extras" id="mapDrawExtras" hidden>
                  <button type="button" class="map-zone-draw-btn map-zone-draw-btn--mini" id="mapDrawToZoneBtn" title="Добавить последнюю точку в выбранную зону" hidden>В зону</button>
                  <button type="button" class="map-zone-draw-btn map-zone-draw-btn--mini" id="mapDrawFinishBtn" title="Завершить ломаную">Готово</button>
                  <button type="button" class="map-zone-draw-btn map-zone-draw-btn--mini map-zone-draw-btn--ghost" id="mapDrawClearBtn" title="Удалить чертёж">Очистить</button>
                </div>
                <div class="map-edit-tools__save">
                  <button type="button" class="map-edit-save" id="mapSaveBtn" disabled>Сохранить</button>
                  <button type="button" class="map-edit-cancel" id="mapCancelEditBtn">Отмена</button>
                </div>
              </div>
            </div>
          </div>
          <p id="mapOfflineSyncStatus" class="map-offline-sync-status" hidden></p>
          <p id="mapFieldPackStatus" class="map-field-pack-status" hidden></p>
          <button type="button" class="map-field-pack-cancel" id="mapFieldPackCancel" hidden>
            Остановить синхронизацию
          </button>
          <p id="mapZoneEditHint" class="map-zone-edit-hint" hidden></p>
        </div>
      </div>
    </section>
  </div>

  <div class="photo-viewer-overlay" id="photoViewerOverlay">
    <button type="button" class="photo-viewer-close" id="photoViewerClose" title="Закрыть">✕</button>
    <img id="photoViewerImg" src="" alt="" />
  </div>

  <div class="mask-controls mask-controls--dock" id="mapGenplanMaskPanel" hidden>
    <div class="mask-controls__head">
      <span class="mask-controls__title">Генплан</span>
      <button type="button" class="mask-controls__toggle-mode" id="mapGenplanMaskCompactToggle" title="Развернуть настройки" aria-label="Развернуть настройки">▾</button>
    </div>
    <p class="mask-controls__hint">Сверьте разбивочник с метками. Перетаскивание, углы — размер, кружок сверху — поворот.</p>
    <p class="mask-controls__file" id="mapGenplanMaskFile"></p>
    <p class="mask-controls__msg" id="mapGenplanMaskMsg" hidden></p>
    <div id="mapGenplanMaskFull">
      <input id="mapGenplanMaskFileInput" accept="image/*" type="file" hidden />
      <label class="mask-controls__btn mask-controls__btn--outline" for="mapGenplanMaskFileInput">Загрузить изображение</label>
      <div class="mask-controls__row">
        <button type="button" class="mask-controls__btn" id="mapGenplanMaskShowBtn">Скрыть / показать</button>
        <button type="button" class="mask-controls__btn" id="mapGenplanMaskEditBtn">Редактировать</button>
      </div>
      <div class="mask-controls__row">
        <button type="button" class="mask-controls__btn mask-controls__btn--outline" id="mapGenplanMaskResetImgBtn">Сбросить файл</button>
        <button type="button" class="mask-controls__btn mask-controls__btn--outline" id="mapGenplanMaskResetBtn">Сбросить положение</button>
      </div>
      <label class="mask-controls__field">
        <span class="mask-controls__field-label">Прозрачность</span>
        <input type="range" id="mapGenplanMaskOpacity" min="0.05" max="1" step="0.05" value="0.55" />
      </label>
      <label class="mask-controls__field">
        <span class="mask-controls__field-label">Угол, °</span>
        <input type="number" id="mapGenplanMaskAngle" step="1" value="0" />
      </label>
      <label class="mask-controls__field">
        <span class="mask-controls__field-label">Режим наложения</span>
        <select id="mapGenplanMaskBlend"></select>
      </label>
      <div class="mask-controls__row mask-controls__row--actions">
        <button type="button" class="mask-controls__btn mask-controls__btn--primary" id="mapGenplanMaskSaveBtn">Сохранить</button>
        <button type="button" class="mask-controls__btn mask-controls__btn--ghost" id="mapGenplanMaskCancelBtn">Закрыть</button>
      </div>
    </div>
    <div id="mapGenplanMaskShort" hidden></div>
  </div>

  <div class="map-fullscreen-overlay" id="mapFullscreenOverlay">
    <div class="map-fullscreen-header">
      <span class="map-fullscreen-title">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2196F3" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
        Карта BLE-меток
      </span>
      <button type="button" class="map-fullscreen-close" id="mapFullscreenClose">✕ Закрыть</button>
    </div>
    <div class="map-fullscreen-controls" id="mapFsFilters">
      <button type="button" class="map-filter-btn filter-all active" data-fsfilter="all">Все <span class="filter-count" id="fcFsAll">0</span></button>
      <button type="button" class="map-filter-btn filter-inspection" data-fsfilter="inspection">Не пройденные <span class="filter-count" id="fcFsInsp">0</span></button>
    </div>
    <div class="map-fullscreen-layer">
      <label class="map-route-field map-route-field--compact map-toolbar-field--layer">
        <span class="map-route-field__label">Карта</span>
        <select id="mapFsBaseLayerSelect" aria-label="Подложка карты">
          <option value="street">Схема</option>
          <option value="satellite">Спутник</option>
          <option value="hybrid">Гибрид</option>
          <option value="genplan" id="mapFsBaseLayerGenplanOpt" hidden>Генплан</option>
        </select>
      </label>
      <div class="map-fullscreen-search">
        <input type="text" id="mapFsSearch" placeholder="№ метки" inputmode="numeric" autocomplete="off" enterkeyhint="search" />
        <button type="button" class="map-fullscreen-search-clear" id="mapFsSearchClear" title="Очистить">✕</button>
      </div>
    </div>
    <div class="map-fs-chrome" id="mapFsChrome">
      <label class="map-route-field map-route-field--fs" id="mapRouteFieldFs" hidden>
        <span class="map-route-field__label">Маршрут</span>
        <select class="map-route-select" id="mapRouteSelectFs" data-ble-route-select aria-label="Маршрут">
          <option value="">Все маршруты</option>
        </select>
      </label>
      <div id="mapEditBar" class="map-edit-bar map-edit-bar--fs" hidden aria-hidden="true">
        <button type="button" class="map-edit-toggle" id="mapEditToggle" hidden tabindex="-1">Редактирование</button>
      </div>
    </div>
    <div id="bleMapFS"></div>
    <div id="mapFsMsg" class="map-msg map-fs-msg" hidden aria-live="polite"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-imageoverlay-rotated@0.2.0/ImageOverlay.Rotated.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/fflate@0.8.2/umd/index.min.js" crossorigin="anonymous"></script>
  <script src="ble-genplan-mask.js?v=20260520m"></script>
  <script src="ble-map.js?v=20260523i"></script>
  <script src="ble-map-fullscreen-patch.js?v=20260520a"></script>
</body>
</html>
