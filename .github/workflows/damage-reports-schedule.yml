name: Damage reports scheduled refresh

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/damage-reports-schedule.yml"
  schedule:
    # UTC → Europe/Moscow (UTC+3): 07:00 = 10:00
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      target_date:
        description: "Report date in YYYY-MM-DD. Empty means yesterday in Europe/Moscow."
        required: false
        type: string
      report_chat_target:
        description: "Where to send the Telegram report: default, group, personal, or custom."
        required: false
        default: default
        type: choice
        options:
          - default
          - group
          - personal
          - custom
      custom_report_chat:
        description: "Custom destination for manual runs. Supports -100..., -100.../topic, https://t.me/c/.../..., or comma-separated values."
        required: false
        type: string
      send_telegram:
        description: "Send the Telegram report after refresh."
        required: false
        default: true
        type: boolean
      force_resend:
        description: "Ignore send marker and allow a second Telegram message for the same date (manual only)."
        required: false
        default: false
        type: boolean

permissions:
  actions: write
  contents: write

concurrency:
  group: damage-reports-cron
  cancel-in-progress: true

jobs:
  refresh-damage-reports:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Europe/Moscow
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync checkout to latest main
        if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          git fetch origin main
          git checkout -B main origin/main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Prepare virtualenv
        run: |
          python -m venv .venv
          ./.venv/bin/python -m pip install --upgrade pip
          ./.venv/bin/python -m pip install -e ./tgdevice

      - name: Resolve target date
        id: target-date
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.target_date }}" ]; then
            target_date="${{ github.event.inputs.target_date }}"
          else
            target_date="$(date -d 'yesterday' +%F)"
          fi
          echo "target_date=$target_date" >> "$GITHUB_OUTPUT"
          echo "Using target date: $target_date"

      - name: Check Telegram send marker on origin
        id: run-mode
        shell: bash
        run: |
          set -euo pipefail
          target_date="${{ steps.target-date.outputs.target_date }}"
          marker_path="data/damage-reports/.telegram-sent/${target_date}.txt"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Manual run — data refresh allowed; Telegram guarded separately."
            exit 0
          fi

          git fetch origin main --quiet
          if git cat-file -e "origin/main:${marker_path}" 2>/dev/null; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Telegram already sent for ${target_date} (marker on origin/main)."
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "No send marker on origin/main for ${target_date}."
          fi

      - name: Note workflow-only push
        if: ${{ github.event_name == 'push' }}
        run: echo "Workflow file updated on main — schedule re-registered; no report run on push."

      - name: Write tgdevice env file
        if: ${{ steps.run-mode.outputs.should_run == 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
        shell: bash
        run: |
          if [ -z "${{ secrets.TELETHON_STRING_SESSION }}" ]; then
            echo "Missing TELETHON_STRING_SESSION secret" >&2
            exit 1
          fi
          report_chat_target=""
          case "${{ github.event.inputs.report_chat_target }}" in
            ""|"default")
              report_chat_target="${{ secrets.TELEGRAM_REPORT_CHAT_IDS }}"
              if [ -z "$report_chat_target" ]; then
                report_chat_target="${{ secrets.TELEGRAM_REPORT_CHAT_ID }}"
              fi
              ;;
            "group")
              report_chat_target="${{ secrets.TELEGRAM_REPORT_CHAT_GROUP }}"
              ;;
            "personal")
              report_chat_target="${{ secrets.TELEGRAM_REPORT_CHAT_PERSONAL }}"
              ;;
            "custom")
              report_chat_target="${{ github.event.inputs.custom_report_chat }}"
              ;;
            *)
              echo "Unsupported report_chat_target value: ${{ github.event.inputs.report_chat_target }}" >&2
              exit 1
              ;;
          esac
          wants_telegram="false"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            wants_telegram="true"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.send_telegram }}" = "true" ]; then
            wants_telegram="true"
          fi
          if [ "$wants_telegram" = "true" ] && [ -z "$report_chat_target" ]; then
            echo "Telegram destination is empty. Check secrets or report_chat_target input." >&2
            exit 1
          fi
          {
            printf '%s\n' "TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}"
            printf '%s\n' "TELEGRAM_REPORT_CHAT_ID="
            printf '%s\n' "TELEGRAM_REPORT_CHAT_IDS=$report_chat_target"
            printf '%s\n' "TELEGRAM_SOURCE_CHAT_ID=${{ secrets.TELEGRAM_SOURCE_CHAT_ID }}"
            printf '%s\n' "TELETHON_API_ID=${{ secrets.TELETHON_API_ID }}"
            printf '%s\n' "TELETHON_API_HASH=${{ secrets.TELETHON_API_HASH }}"
            printf '%s\n' "TELETHON_STRING_SESSION=${{ secrets.TELETHON_STRING_SESSION }}"
            printf '%s\n' "SITE_BASE_URL=https://device.workwatch.pro/"
            printf '%s\n' "SITE_LOGIN_PATH=/login.php"
            printf '%s\n' "SITE_SERVICE_REQUESTS_PATH=/views/service_requests/index.php"
            printf '%s\n' "SITE_USERNAME=${{ secrets.SITE_USERNAME }}"
            printf '%s\n' "SITE_PASSWORD=${{ secrets.SITE_PASSWORD }}"
            printf '%s\n' "DATABASE_PATH=../data/tgdevice.sqlite3"
            printf '%s\n' "TIMEZONE=Europe/Moscow"
            printf '%s\n' "REPORT_HOUR=09:00"
          } > tgdevice/.env

      - name: Validate restored Telethon session
        if: ${{ steps.run-mode.outputs.should_run == 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
        working-directory: tgdevice
        shell: bash
        run: |
          ../.venv/bin/python - <<'PY'
          import asyncio
          from tgdevice.config import load_settings
          from telethon import TelegramClient
          from telethon.sessions import StringSession

          settings = load_settings(".env")

          async def main():
              client = TelegramClient(
                  StringSession(settings.telethon_string_session),
                  int(settings.telethon_api_id),
                  settings.telethon_api_hash,
              )
              await client.connect()
              authorized = await client.is_user_authorized()
              await client.disconnect()
              if not authorized:
                  raise RuntimeError(
                      "TELETHON_STRING_SESSION is present but not authorized. "
                      "Regenerate it with tgdevice.main telethon-string-session using "
                      "the same TELETHON_API_ID and TELETHON_API_HASH as the GitHub secrets."
                  )
              print("Telethon string session is authorized")

          asyncio.run(main())
          PY

      - name: Collect incidents and build report payloads
        if: ${{ steps.run-mode.outputs.should_run == 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
        working-directory: tgdevice
        shell: bash
        run: |
          ../.venv/bin/python -m tgdevice.main init-db
          ../.venv/bin/python -m tgdevice.main import-history --date "${{ steps.target-date.outputs.target_date }}"
          ../.venv/bin/python -m tgdevice.main fetch-site --date "${{ steps.target-date.outputs.target_date }}"

      - name: Claim Telegram send slot on origin
        id: telegram-claim
        if: ${{ steps.run-mode.outputs.should_run == 'true' && ((github.event_name == 'schedule') || (github.event_name == 'workflow_dispatch' && github.event.inputs.send_telegram == 'true')) }}
        shell: bash
        run: |
          set -euo pipefail
          target_date="${{ steps.target-date.outputs.target_date }}"
          marker_path="data/damage-reports/.telegram-sent/${target_date}.txt"
          force_resend="${{ github.event.inputs.force_resend }}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          skip_if_marker_present() {
            if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "$force_resend" = "true" ]; then
              return 1
            fi
            git fetch origin main --quiet
            git cat-file -e "origin/main:${marker_path}" 2>/dev/null
          }

          if skip_if_marker_present; then
            echo "Marker already on origin/main — will NOT send Telegram."
            echo "send=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          for attempt in 1 2 3 4 5; do
            git fetch origin main --quiet
            git checkout -B main origin/main

            if skip_if_marker_present; then
              echo "Marker appeared on main — will NOT send Telegram."
              echo "send=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            mkdir -p "data/damage-reports/.telegram-sent"
            {
              echo "date=${target_date}"
              echo "status=claimed"
              echo "run_id=${{ github.run_id }}"
              date -u +"claimed_at=%Y-%m-%dT%H:%M:%SZ"
            } > "$marker_path"

            git add "$marker_path"
            git commit -m "chore: claim damage report telegram for ${target_date}"

            if git push origin HEAD:main; then
              echo "Claimed Telegram send slot for ${target_date}"
              echo "send=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "Push rejected (attempt ${attempt}), another run may have claimed first — retrying..."
            sleep 2
          done

          if skip_if_marker_present; then
            echo "Another run claimed the marker — will NOT send Telegram."
            echo "send=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Failed to claim Telegram send slot" >&2
          echo "send=false" >> "$GITHUB_OUTPUT"
          exit 1

      - name: Send Telegram report
        if: ${{ steps.telegram-claim.outputs.send == 'true' }}
        working-directory: tgdevice
        shell: bash
        run: |
          ../.venv/bin/python -m tgdevice.main report --date "${{ steps.target-date.outputs.target_date }}" --send

      - name: Finalize Telegram send marker
        if: ${{ steps.telegram-claim.outputs.send == 'true' }}
        shell: bash
        run: |
          target_date="${{ steps.target-date.outputs.target_date }}"
          marker_path="data/damage-reports/.telegram-sent/${target_date}.txt"
          {
            echo "date=${target_date}"
            echo "status=sent"
            echo "run_id=${{ github.run_id }}"
            date -u +"sent_at=%Y-%m-%dT%H:%M:%SZ"
          } > "$marker_path"

      - name: Export static JSON for Pages
        if: ${{ steps.run-mode.outputs.should_run == 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
        shell: bash
        run: |
          ./.venv/bin/python scripts/export-damage-reports.py --db data/tgdevice.sqlite3 --out data/damage-reports

      - name: Commit and push if reports changed
        if: ${{ steps.run-mode.outputs.should_run == 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          target_date="${{ steps.target-date.outputs.target_date }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main --quiet
          git checkout -B main origin/main
          git add data/damage-reports
          if git diff --cached --quiet; then
            echo "Damage reports unchanged"
            exit 0
          fi
          git commit -m "chore: refresh damage reports for ${target_date}"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              gh workflow run pages.yml --ref main
              exit 0
            fi
            echo "Push rejected (attempt ${attempt}), rebasing on origin/main..."
            git pull --rebase origin main
          done
          echo "Failed to push damage reports" >&2
          exit 1
