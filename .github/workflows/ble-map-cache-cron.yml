# Авто-↻ data/ble-map-cache.json каждые 30 мин → push main → GitHub Pages.
# Работает без открытой вкладки браузера (в отличие от setInterval в ble-map.js).
name: BLE map cache auto-refresh

on:
  schedule:
    # Каждые 30 минут (UTC)
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ble-map-cache-cron
  cancel-in-progress: false

jobs:
  refresh-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Download markers and write cache
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/push-ble-cache.mjs

      - name: Commit and push if cache changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ble-map-cache.json data/ble-map-cache-meta.json
          if git diff --cached --quiet; then
            echo "Cache unchanged — no commit"
            exit 0
          fi
          git commit -m "chore: авто-обновление кэша BLE-меток (cron 30 мин)"
          git push origin HEAD:main
