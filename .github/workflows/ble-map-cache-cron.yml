# Авто-↻ data/ble-map-cache.json каждые 30 мин → push main → GitHub Pages.
# Работает без открытой вкладки браузера (в отличие от setInterval в ble-map.js).
name: BLE map cache auto-refresh

on:
  schedule:
    # Каждые 30 минут (UTC)
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: ble-map-cache-cron
  cancel-in-progress: false

jobs:
  refresh-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Download markers and write cache
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/push-ble-cache.mjs

      - name: Commit and push if cache changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ble-map-cache.json data/ble-map-cache-meta.json
          if git diff --cached --quiet; then
            echo "Cache unchanged — no commit"
            exit 0
          fi
          git commit -m "chore: авто-обновление кэша BLE-меток (cron 30 мин)"
          git push origin HEAD:main

  damage-reports-bridge:
    if: ${{ github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Europe/Moscow
    steps:
      - uses: actions/checkout@v4

      - name: Gate damage report window
        id: gate
        shell: bash
        run: |
          utc_hour="$(date -u +%H)"
          if [ "$utc_hour" = "05" ] || [ "$utc_hour" = "06" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Inside damage report bridge window."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Outside damage report bridge window."
          fi

      - uses: actions/setup-python@v5
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        with:
          python-version: "3.11"

      - name: Prepare tgdevice
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        run: |
          python -m venv .venv
          ./.venv/bin/python -m pip install --upgrade pip
          ./.venv/bin/python -m pip install -e ./tgdevice

      - name: Resolve target date
        id: target-date
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        shell: bash
        run: |
          target_date="$(date -d 'yesterday' +%F)"
          echo "target_date=$target_date" >> "$GITHUB_OUTPUT"
          echo "Using target date: $target_date"

      - name: Check Telegram sent marker
        id: telegram-sent
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        shell: bash
        run: |
          marker_path="data/damage-reports/.telegram-sent/${{ steps.target-date.outputs.target_date }}.txt"
          if git cat-file -e "HEAD:${marker_path}" 2>/dev/null; then
            echo "already_sent=true" >> "$GITHUB_OUTPUT"
            echo "Telegram report already sent for ${{ steps.target-date.outputs.target_date }}."
          else
            echo "already_sent=false" >> "$GITHUB_OUTPUT"
            echo "Telegram report has not been sent for ${{ steps.target-date.outputs.target_date }}."
          fi

      - name: Write tgdevice env file
        if: ${{ steps.gate.outputs.enabled == 'true' && steps.telegram-sent.outputs.already_sent != 'true' }}
        shell: bash
        run: |
          if [ -z "${{ secrets.TELETHON_STRING_SESSION }}" ]; then
            echo "Missing TELETHON_STRING_SESSION secret" >&2
            exit 1
          fi
          report_chat_target="${{ secrets.TELEGRAM_REPORT_CHAT_IDS }}"
          if [ -z "$report_chat_target" ]; then
            report_chat_target="${{ secrets.TELEGRAM_REPORT_CHAT_ID }}"
          fi
          if [ -z "$report_chat_target" ]; then
            echo "Telegram destination is empty. Check TELEGRAM_REPORT_CHAT_IDS or TELEGRAM_REPORT_CHAT_ID." >&2
            exit 1
          fi
          {
            printf '%s\n' "TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}"
            printf '%s\n' "TELEGRAM_REPORT_CHAT_ID="
            printf '%s\n' "TELEGRAM_REPORT_CHAT_IDS=$report_chat_target"
            printf '%s\n' "TELEGRAM_SOURCE_CHAT_ID=${{ secrets.TELEGRAM_SOURCE_CHAT_ID }}"
            printf '%s\n' "TELETHON_API_ID=${{ secrets.TELETHON_API_ID }}"
            printf '%s\n' "TELETHON_API_HASH=${{ secrets.TELETHON_API_HASH }}"
            printf '%s\n' "TELETHON_STRING_SESSION=${{ secrets.TELETHON_STRING_SESSION }}"
            printf '%s\n' "SITE_BASE_URL=https://device.workwatch.pro/"
            printf '%s\n' "SITE_LOGIN_PATH=/login.php"
            printf '%s\n' "SITE_SERVICE_REQUESTS_PATH=/views/service_requests/index.php"
            printf '%s\n' "SITE_USERNAME=${{ secrets.SITE_USERNAME }}"
            printf '%s\n' "SITE_PASSWORD=${{ secrets.SITE_PASSWORD }}"
            printf '%s\n' "DATABASE_PATH=../data/tgdevice.sqlite3"
            printf '%s\n' "TIMEZONE=Europe/Moscow"
            printf '%s\n' "REPORT_HOUR=08:00"
          } > tgdevice/.env

      - name: Validate restored Telethon session
        if: ${{ steps.gate.outputs.enabled == 'true' && steps.telegram-sent.outputs.already_sent != 'true' }}
        working-directory: tgdevice
        shell: bash
        run: |
          ../.venv/bin/python - <<'PY'
          import asyncio
          from tgdevice.config import load_settings
          from telethon import TelegramClient
          from telethon.sessions import StringSession

          settings = load_settings(".env")

          async def main():
              client = TelegramClient(
                  StringSession(settings.telethon_string_session),
                  int(settings.telethon_api_id),
                  settings.telethon_api_hash,
              )
              await client.connect()
              authorized = await client.is_user_authorized()
              await client.disconnect()
              if not authorized:
                  raise RuntimeError("TELETHON_STRING_SESSION is present but not authorized.")
              print("Telethon string session is authorized")

          asyncio.run(main())
          PY

      - name: Collect incidents and send Telegram report
        if: ${{ steps.gate.outputs.enabled == 'true' && steps.telegram-sent.outputs.already_sent != 'true' }}
        working-directory: tgdevice
        shell: bash
        run: |
          ../.venv/bin/python -m tgdevice.main init-db
          ../.venv/bin/python -m tgdevice.main import-history --date "${{ steps.target-date.outputs.target_date }}"
          ../.venv/bin/python -m tgdevice.main fetch-site --date "${{ steps.target-date.outputs.target_date }}"
          ../.venv/bin/python -m tgdevice.main report --date "${{ steps.target-date.outputs.target_date }}" --send

      - name: Export static JSON for Pages
        if: ${{ steps.gate.outputs.enabled == 'true' && steps.telegram-sent.outputs.already_sent != 'true' }}
        shell: bash
        run: |
          ./.venv/bin/python scripts/export-damage-reports.py --db data/tgdevice.sqlite3 --out data/damage-reports

      - name: Mark Telegram report sent
        if: ${{ steps.gate.outputs.enabled == 'true' && steps.telegram-sent.outputs.already_sent != 'true' }}
        shell: bash
        run: |
          marker_dir="data/damage-reports/.telegram-sent"
          mkdir -p "$marker_dir"
          {
            echo "date=${{ steps.target-date.outputs.target_date }}"
            echo "run_id=${{ github.run_id }}"
            echo "source=ble-map-cache-cron-bridge"
            date -u +"sent_at=%Y-%m-%dT%H:%M:%SZ"
          } > "$marker_dir/${{ steps.target-date.outputs.target_date }}.txt"

      - name: Commit and push if reports changed
        if: ${{ steps.gate.outputs.enabled == 'true' && steps.telegram-sent.outputs.already_sent != 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/damage-reports
          if git diff --cached --quiet; then
            echo "Damage reports unchanged"
            exit 0
          fi
          git commit -m "chore: refresh damage reports for ${{ steps.target-date.outputs.target_date }}"
          git push origin HEAD:main
          gh workflow run pages.yml --ref main
